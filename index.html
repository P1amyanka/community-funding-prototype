<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#245447">
  <title>Comfundy</title>
  <link rel="stylesheet" href="css/styles.css?v=0.4.2-r19">
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand-stack">
        <div class="brand">Comfundy</div>
        <div class="brand-subtitle">для шкільних спільнот</div>
      </div>
      <button id="managerMenuButton" class="menu-button hidden" aria-label="Відкрити меню" onclick="openManagerMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
  <main class="app" id="app"></main>
  <div id="managerMenuDrawer" class="manager-menu-drawer" aria-hidden="true">
    <button class="manager-menu-backdrop" aria-label="Закрити меню" onclick="closeManagerMenu()"></button>
    <aside class="manager-menu-panel" role="dialog" aria-modal="true" aria-label="Навігація кабінету">
      <div class="manager-menu-head"><strong>Кабінет</strong><button class="manager-menu-close" aria-label="Закрити" onclick="closeManagerMenu()">×</button></div>
      <nav id="managerMenuLinks" class="manager-menu-links"></nav>
      <div id="managerMenuAccount" class="manager-menu-account"></div>
    </aside>
  </div>
  <footer class="footer">
    <nav class="footer-inner" aria-label="Навігація">
      <a class="footer-link" href="#/">Головна</a>
      <span class="footer-separator">|</span>
      <a class="footer-link" href="#/about">Про платформу</a>
      <span class="footer-separator">|</span>
      <a class="footer-link" href="#/feedback">Зворотний зв'язок</a>
      <span class="footer-separator">|</span>
      <a class="footer-link" id="accountNavLink" href="#/login">Увійти</a>
    </nav>
  </footer>
  <div class="toast" id="toast">Оновлено</div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/app.js?v=0.4.2-r19"></script>
</body>
</html>
